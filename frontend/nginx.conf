server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kamal proxy health check
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Proxy API requests to Express backend
    location /api/ {
        proxy_pass http://backend:3000/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}